<head>

<style>
:root{--bg:#F4EEE4;--card:#FBF8F2;--ink:#1F1B18;--mut:#6F655C;--line:rgba(60,40,25,.14);--wine:#7A2236;--wine2:#651A2B;--green:#5C6B4A;--dark:#1F2A2E;
--fs:'Source Serif 4','Georgia','Times New Roman',serif;--ff:'Inter',system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--ff);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}svg{display:block}h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.wrap{width:min(1200px,100% - 2.4rem);margin-inline:auto}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:48px;padding:.75rem 1.4rem;border-radius:12px;border:1.5px solid transparent;font:500 .95rem var(--ff);text-decoration:none;cursor:pointer;transition:transform .25s,background .25s,box-shadow .25s,color .25s}
.btn .ic{width:18px;height:18px;transition:transform .25s}
.btn:hover:not([aria-disabled=true]){transform:translateY(-2px);box-shadow:0 8px 20px rgba(60,30,20,.18)}.btn:hover .ar{transform:translateX(4px)}
.b-wine{background:var(--wine);color:#fff}.b-wine:hover{background:var(--wine2)}
.b-dark{background:var(--dark);color:#fff}
.b-green{background:var(--green);color:#fff}
.b-line{background:rgba(255,255,255,.55);border-color:var(--wine);color:var(--ink)}
.b-off{background:#E3DDD3;color:#6d655d;cursor:default}
header.top{position:sticky;top:0;z-index:50;background:rgba(244,238,228,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo{font:600 1.55rem/.95 var(--fs);text-decoration:none;letter-spacing:-.01em}
.nav ul{display:flex;align-items:center;gap:1.8rem;list-style:none;margin:0;padding:0}
.nav ul a:not(.btn){text-decoration:none;font-size:.9rem;font-weight:500;padding:.5rem 0;border-bottom:2px solid transparent;transition:border-color .25s}
.nav ul a:not(.btn):hover{border-color:var(--wine)}
.burger{display:none;width:46px;height:46px;border:1.5px solid var(--ink);background:none;border-radius:12px;font-size:1.3rem;cursor:pointer;color:var(--ink)}
@media(max-width:820px){.burger{display:block}.nav ul{position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;padding:.5rem 1.2rem 1.2rem;border-bottom:1px solid var(--line);display:none}.nav ul.open{display:flex}.nav ul a:not(.btn){display:block;padding:.9rem 0;border-bottom:1px solid var(--line)}.nav ul li:last-child{padding-top:1rem}}
.hero{position:relative;margin-top:1.2rem;border-radius:18px;overflow:hidden;min-height:clamp(540px,76vh,640px);display:flex;align-items:center;background:#E9CFB5}
.hero>svg{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(244,238,228,.88) 0%,rgba(244,238,228,.55) 38%,transparent 66%)}
@media(max-width:760px){.hero::after{background:linear-gradient(180deg,rgba(244,238,228,.92) 0%,rgba(244,238,228,.7) 55%,rgba(244,238,228,.2) 100%)}.hero{align-items:flex-start}}
.hero-in{position:relative;z-index:2;padding:clamp(1.6rem,5vw,4rem);max-width:640px}
.hero h1{font:500 clamp(2.7rem,6.6vw,5.2rem)/.98 var(--fs);letter-spacing:-.02em}
.hero h1 span{display:block;opacity:0;transform:translateY(22px);animation:fu .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.14s + .1s)}
.hero p.lead{margin-top:1.3rem;font-size:1.1rem;max-width:30rem;opacity:0;transform:translateY(22px);animation:fu .9s .5s forwards}
.hero .cta{margin-top:1.8rem;display:flex;flex-wrap:wrap;gap:.8rem;opacity:0;transform:translateY(22px);animation:fu .9s .65s forwards}
@keyframes fu{to{opacity:1;transform:none}}
.feats{display:grid;grid-template-columns:repeat(3,1fr);margin-block:2.2rem}
.feat{display:flex;gap:1rem;padding:.4rem 1.6rem;text-decoration:none;align-items:flex-start}
.feat+.feat{border-left:1px solid var(--line)}
.feat b{display:block;font-weight:600}.feat small{display:block;color:var(--mut);font-size:.88rem;line-height:1.4;margin-top:.15rem}
.feat .ic{width:30px;height:30px;stroke-width:1.3;margin-top:.15rem}
a.feat:hover b{color:var(--wine)}
@media(max-width:760px){.feats{grid-template-columns:1fr;gap:.6rem}.feat{padding:.6rem 0}.feat+.feat{border-left:0;border-top:1px solid var(--line);padding-top:1.1rem}}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:2.6rem 0 1.4rem}
.sec-h h2{font:500 clamp(1.9rem,4vw,2.6rem)/1.1 var(--fs)}
.sec-h a{font-size:.85rem;font-weight:500;text-decoration:none;display:flex;gap:.4rem;align-items:center}.sec-h a:hover{color:var(--wine)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem}
@media(max-width:900px){.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:1rem;margin-inline:-1.2rem;padding:0 1.2rem 1rem;scroll-padding-left:1.2rem;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}.card{flex:0 0 82%;scroll-snap-align:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .4s,box-shadow .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(70,40,25,.14)}
.card .im{aspect-ratio:2/1;overflow:hidden;position:relative}
.card .im>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .im>*{transform:scale(1.06)}
.card .bd{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;flex:1}
.chip{align-self:flex-start;background:#E8DFC9;color:#5B5340;font-size:.74rem;font-weight:500;padding:.2rem .7rem;border-radius:8px}
.card h3{font:500 1.6rem/1.15 var(--fs)}
.meta{display:flex;gap:1.3rem;color:var(--mut);font-size:.88rem}.meta span{display:flex;align-items:center;gap:.45rem}.meta .ic{width:17px;height:17px}
.card p.d{font-size:.95rem;color:#3d352f}
.card .btn{align-self:flex-start;margin-top:auto;min-height:44px;padding:.55rem 1.2rem;font-size:.88rem}
.how{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center;margin-top:4rem}
@media(max-width:860px){.how{grid-template-columns:1fr}}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);margin-bottom:.8rem}
.how h2{font:500 clamp(1.9rem,4vw,2.7rem)/1.1 var(--fs)}
.steps{list-style:none;margin:1.3rem 0 0;padding:0;display:grid;gap:.9rem;counter-reset:s}
.steps li{display:flex;gap:.9rem;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font:600 .85rem var(--ff)}
.vid{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#C9A98C;border:1px solid var(--line)}
.vid>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .play{inset:auto;left:50%;top:50%;translate:-50% -50%;width:84px;height:84px;border-radius:50%;border:0;background:var(--wine);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .3s}
.vid .play:hover{transform:scale(1.08)}.vid .play .ic{fill:#fff;width:32px;height:32px;margin-left:4px}
.vnote{margin-top:.7rem;font-size:.82rem;color:var(--mut)}
.about{display:grid;grid-template-columns:1fr 1.15fr;border-radius:18px;overflow:hidden;margin-top:4rem;background:var(--wine);color:#F8EEE6}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.about .tx{padding:clamp(1.6rem,4vw,3rem);display:flex;flex-direction:column;gap:1rem;align-items:flex-start}
.about .eyebrow{color:#E9C9C0;margin:0}
.about h2{font:500 clamp(2rem,4vw,2.9rem)/1.05 var(--fs)}
.about p{max-width:30rem;opacity:.92}
.about .lnk{margin-top:.5rem;color:#fff;text-decoration:none;font-weight:500;display:inline-flex;gap:.5rem;align-items:center;min-height:44px;border-bottom:1.5px solid rgba(255,255,255,.4)}
.about .lnk:hover{border-color:#fff}
.about .art{min-height:260px;position:relative}.about .art svg{position:absolute;inset:0;width:100%;height:100%}
footer{margin-top:3.5rem;border-top:1px solid var(--line);padding-block:1.8rem calc(1.8rem + env(safe-area-inset-bottom,0px))}
.fin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem 2rem}
.fin .logo{font-size:1.25rem}.fin .sl{color:var(--mut);font-size:.82rem;max-width:18rem;margin-top:.3rem}
.fl{display:flex;gap:.3rem 1.4rem;flex-wrap:wrap;font-size:.9rem}.fl a{text-decoration:none;padding:.5rem 0}.fl a:hover{color:var(--wine)}
.fcp{color:var(--mut);font-size:.8rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.up{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:none;cursor:pointer;color:var(--ink);transition:background .25s,color .25s}.up:hover{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--dark);color:#fff;padding:.85rem 1.2rem;border-radius:12px;opacity:0;pointer-events:none;transition:.35s;z-index:99;max-width:92vw;font-size:.9rem}.toast.show{opacity:1;translate:-50% 0}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*.1s)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.hero h1 span,.hero p.lead,.hero .cta,.rv{opacity:1;transform:none}}
</style>
</head>

<script>
/* ===== CONFIG: всё, что можно менять, — здесь ===== */
const CONFIG={

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const P={ar:'<path d="M5 12h14M12 5l7 7-7 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',bot:'<circle cx="12" cy="11" r="8"/><path d="M8 20l-1 2M16 20l1 2M9 10v1M15 10v1M9.5 14c1.5 1.2 3.5 1.2 5 0"/>',hp:'<path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>',play:'<path d="M6 3l14 9-14 9z"/>'};

const CH=lk(CONFIG.telegramChannelUrl,'telegramChannelUrl'),BOT=lk(CONFIG.telegramBotUrl,'telegramBotUrl');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3800)};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-ph]');if(a){e.preventDefault();toast(`Ссылка не задана: впишите ${a.dataset.ph} в CONFIG`)}});
/* иллюстрации-заглушки, пока не добавлены фотографии */
function art(i){let g='';
 if(i==0){g='<rect width="400" height="200" fill="#EAD7BE"/><rect y="150" width="400" height="50" fill="#6B5A4E"/><rect x="40" y="40" width="250" height="115" fill="#8E3B2C"/>';for(let r=0;r<2;r++)for(let c=0;c<7;c++)g+=`<rect x="${58+c*34}" y="${58+r*48}" width="20" height="32" rx="10" fill="#E8D1AA"/>`;g+='<rect x="300" y="70" width="70" height="85" fill="#B9553F"/><circle cx="345" cy="70" r="34" fill="#4C6A44"/>'}
 else if(i==1){g='<rect width="400" height="200" fill="#EBC6B3"/><rect y="160" width="400" height="40" fill="#8B6B5A"/>';[[90,38,'#3F7C5E'],[200,52,'#B9553F'],[310,38,'#D6A64A']].forEach(([x,r,c])=>{g+=`<rect x="${x-r+8}" y="${150-r}" width="${2*r-16}" height="${r}" fill="#E7D3BB"/><path d="M${x-r*.8} ${150-r} C${x-r*.8} ${150-r*2} ${x} ${150-r*1.6} ${x} ${150-r*2.6} C${x} ${150-r*1.6} ${x+r*.8} ${150-r*2} ${x+r*.8} ${150-r}Z" fill="${c}"/>`})}
 else{g='<rect width="400" height="200" fill="#E7D8C0"/><rect y="165" width="400" height="35" fill="#7C6B5E"/>';['#D9C28B','#E8DAB8','#C9A982','#D8BFA5','#B8A27A'].forEach((c,k)=>{const h=100+(k%3)*25;g+=`<rect x="${k*80}" y="${165-h}" width="78" height="${h}" fill="${c}"/>`;for(let w=0;w<3;w++)for(let v=0;v<Math.floor(h/36);v++)g+=`<rect x="${k*80+10+w*22}" y="${165-h+12+v*34}" width="14" height="22" fill="#5E4C40" opacity=".55"/>`})}
 return `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Иллюстрация маршрута">${g}</svg>`}
$('#logo').innerHTML=$('#flogo').innerHTML=CONFIG.name.join('<br>');
$('#h1').innerHTML=CONFIG.hero.map((t,i)=>`<span style="--i:${i}">${t}</span>`).join('');$('#lead').textContent=CONFIG.lead;
$('#feats').innerHTML=CONFIG.features.map(f=>{const t=f.link?'a':'div',h=f.link=='bot'?BOT:f.link=='ch'?CH:'';return `<${t} class="feat" ${h}>${ic(f.icon)}<span><b>${f.t}</b><small>${f.s}</small></span></${t}>`}).join('');
$('#grid').innerHTML=CONFIG.routes.map((r,i)=>`<article class="card rv" style="--d:${i}"><div class="im">${art(i)}${r.image?`<img src="${r.image}" alt="${r.title}" loading="lazy" onerror="this.remove()">`:''}</div><div class="bd"><span class="chip">${r.tag}</span><h3>${r.title}</h3><div class="meta"><span>${ic('clock')}${r.time}</span><span>${ic('pin')}${r.km}</span></div><p class="d">${r.desc}</p>${r.status=='soon'?'<span class="btn b-off" aria-disabled="true">Скоро</span>':`<a class="btn b-${r.btn}" ${BOT}>Подробнее ${ic('ar','ar')}</a>`}</div></article>`).join('');
$('#howT').textContent=CONFIG.how.title;$('#steps').innerHTML=CONFIG.how.steps.map(s=>`<li>${s}</li>`).join('');
$('#abT').textContent=CONFIG.about.title;$('#abP').textContent=CONFIG.about.text;
$('#slogan').textContent=CONFIG.slogan;$('#copy').textContent=`© ${new Date().getFullYear()} ${CONFIG.name.join(' ')} · ${CONFIG.credit}`;
[['ch','telegramChannelUrl'],['bot','telegramBotUrl']].forEach(([k,n])=>$$(`a[data-${k}]`).forEach(a=>{const u=CONFIG[n];if(ok(u)){a.href=u;a.target='_blank';a.rel='noopener noreferrer'}else a.dataset.ph=n}));
(function(){const U=CONFIG.teaserUrl,f=/\.(mp4|webm|mov)(\?.*)?$/i.test(U),v=$('#vid');
 if(f){v.innerHTML=`<video controls playsinline preload="metadata" ${ok(CONFIG.teaserPoster)?`poster="${CONFIG.teaserPoster}"`:''}><source src="${U}"></video>`;$('video',v).onerror=()=>toast('Не удалось загрузить видео')}
 else{v.innerHTML=art(1)+`<button class="play" aria-label="Смотреть видео">${ic('play')}</button>`;$('.play',v).onclick=()=>ok(U)?open(U,'_blank','noopener'):toast('Видео пока нет: впишите teaserUrl в CONFIG')}
 $('#vnote').textContent=f||ok(U)?'':'Здесь появится видео проекта — укажите PROJECT_TEASER_URL в CONFIG.'})();
const b=$('#burger'),m=$('#menu');b.onclick=()=>{const o=m.classList.toggle('open');b.setAttribute('aria-expanded',o);b.textContent=o?'×':'≡'};
m.onclick=e=>{if(e.target.closest('a')){m.classList.remove('open');b.setAttribute('aria-expanded',false);b.textContent='≡'}};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});$$('.rv').forEach(n=>io.observe(n));
</script>
</body>
</html>
